services:
  habitflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: habitflow-lifeos
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./secrets/.htpasswd:/etc/nginx/.htpasswd:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 100

  caddy:
    image: caddy:2.10-alpine
    container_name: habitflow-https
    restart: unless-stopped
    depends_on:
      - habitflow
    environment:
      HABITFLOW_HOST: ${HABITFLOW_HOST:-localhost}
    ports:
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    pids_limit: 100

volumes:
  caddy_data:
  caddy_config:
