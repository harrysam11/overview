services:
  habitflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: habitflow-lifeos
    restart: unless-stopped
    ports:
      # LAN access for your own devices. Do not forward this port on your router.
      - "8080:80"
    volumes:
      # Required server-level login; create it with setup-self-hosted-auth.sh.
      - ./secrets/.htpasswd:/etc/nginx/.htpasswd:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 100
