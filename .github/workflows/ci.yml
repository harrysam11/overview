name: HabitFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: habitflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint (existing repository debt; informational)
        run: npm run lint
        continue-on-error: true
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Validate self-hosting scripts and Compose
        run: |
          bash -n scripts/setup-self-hosted-auth.sh scripts/start-self-hosted.sh
          docker compose config --quiet
      - name: Build self-hosted Docker image
        run: docker build --tag habitflow:self-hosted .
